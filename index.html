<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #4f7cff;
    --text: #eef1f7;
    --muted: #8a92a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    width: min(360px, 90vw);
    background: var(--card);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .ring {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid rgba(79,124,255,0.2);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
  p { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.5; }
  .status { margin-top: 18px; font-size: 13px; color: var(--accent); min-height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="ring"></div>
    <h1>Verifying your device</h1>
    <p>This confirms one account per device and only takes a moment. Please don't close this window.</p>
    <div class="status" id="status">Preparing...</div>
  </div>

<script>
  var tg = window.Telegram ? window.Telegram.WebApp : null;
  var statusEl = document.getElementById('status');

  function setStatus(text) { statusEl.textContent = text; }

  function buildFingerprint() {
    var parts = [];
    parts.push(navigator.userAgent || '');
    parts.push(navigator.language || '');
    parts.push(String(navigator.hardwareConcurrency || ''));
    parts.push(String(screen.width) + 'x' + String(screen.height));
    parts.push(String(screen.colorDepth || ''));
    try {
      parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
    } catch (e) {
      parts.push('');
    }
    parts.push(String(new Date().getTimezoneOffset()));
    parts.push(navigator.platform || '');

    try {
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillText('device-check-signature', 2, 2);
      parts.push(canvas.toDataURL());
    } catch (e) {
      parts.push('no-canvas');
    }

    return parts.join('||');
  }

  function run() {
    if (tg) {
      tg.ready();
      tg.expand();
    }

    if (!tg || !tg.sendData) {
      setStatus('Please open this page from the bot in Telegram.');
      return;
    }

    setStatus('Collecting device signature...');
    var fp = buildFingerprint();

    setStatus('Sending to bot...');
    var payload = JSON.stringify({ fp: fp });

    tg.sendData(payload);
    setStatus('Done - you can return to the chat.');
    setTimeout(function () {
      try { tg.close(); } catch (e) {}
    }, 600);
  }

  run();
</script>
</body>
</html>
